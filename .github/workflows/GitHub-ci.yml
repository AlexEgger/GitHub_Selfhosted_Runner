name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_COMPILE_BYTECODE: "1"
  UV_LINK_MODE: copy

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check
        continue-on-error: true   # entspricht allow_failure: true

  typechecking:
    needs: lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked

      - name: Type check with ty
        run: uv run ty check

      - name: Export ty report
        run: uv run ty check --output-format=gitlab > gl-code-quality-report-ty.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ty-code-quality-report
          path: gl-code-quality-report-ty.json

  test:
    needs: typechecking
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml